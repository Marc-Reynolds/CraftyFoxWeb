[build]
  # Build command (none needed for static site initially)
  command = "echo 'Static site - no build required'"
  
  # Directory to publish (root directory for now, will be ./dist if build process added later)
  publish = "."
  
  # Functions directory (if needed for serverless functions later)
  functions = "netlify/functions"

[build.environment]
  # Node.js version (for future build tools if needed)
  NODE_VERSION = "18"

# Form handling settings
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Performance headers
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Redirect rules
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/newsletter"
  to = "/#newsletter"
  status = 301

# Form handling (native Netlify forms as backup to Formspree)
[build.processing.forms]
  # Enable Netlify form detection
  spam_action = "block"

# Plugin configuration (optional for future enhancements)
[[plugins]]
  package = "netlify-plugin-lighthouse"
  
  [plugins.inputs.audits]
    output_path = "reports/lighthouse.html"
    
[[plugins]]
  package = "netlify-plugin-html-validate"

# Branch-specific settings
[context.production]
  publish = "."
  command = "echo 'Production build - static site'"

[context.deploy-preview]
  publish = "."
  command = "echo 'Deploy preview - static site'"

[context.branch-deploy]
  publish = "."
  command = "echo 'Branch deploy - static site'"

# Future build settings (uncomment when build process is added)
